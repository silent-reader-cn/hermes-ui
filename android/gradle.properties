org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 本地构建网络加固：Clash 代理下 HTTP/2 握手易被重置（Remote host terminated
# the handshake），强制 JDK HttpClient 走 HTTP/1.1 并加大超时/重试。
systemProp.jdk.httpclient.allowHttp2=false
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=500
# Kotlin 增量编译缓存在本机反复损坏（Could not close incremental caches），
# 关闭增量编译保证构建确定性（代价：编译略慢）。
kotlin.incremental=false
